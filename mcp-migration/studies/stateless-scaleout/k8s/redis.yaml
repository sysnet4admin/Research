# B쪽 Redis 백엔드 handle 저장소 (단일 인스턴스, 측정 보조 인프라)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mcp-pilot
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mcp-pilot
spec:
  selector: { app: redis }
  ports:
    - port: 6379

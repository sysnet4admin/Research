# Server A: 공식 everything 서버 (v1 SDK, 2025-11-25 세션 기반)
# 세션이 파드 로컬 in-memory Map이라 라운드로빈에서 깨지는 통증 재현체.
# 이미지 전략(파일럿): node:22-slim + npx 런타임 설치. 버전 고정 2026.7.4 (npm은 날짜 버전,
# 리포 package.json의 2.0.0은 미발행. v2 이관 PR #4452 미병합이라 이 버전은 v1 세션 기반).
# 본측정에서는 사전 빌드 이미지로 교체 예정 (기동 지연과 레지스트리 의존 제거).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-a
  namespace: mcp-pilot
  labels: { app: mcp-a }
spec:
  replicas: 2
  selector:
    matchLabels: { app: mcp-a }
  template:
    metadata:
      labels: { app: mcp-a }
    spec:
      containers:
        - name: server
          # 사전 빌드 이미지 (images/build_and_load.sh로 워커 containerd에 적재)
          image: docker.io/mcp-pilot/a-server:2026.7.4
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 3001 }
            initialDelaySeconds: 3
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-a
  namespace: mcp-pilot
  labels: { app: mcp-a }   # agentgateway selector 타깃용
spec:
  type: LoadBalancer
  selector: { app: mcp-a }
  ports:
    - port: 80
      targetPort: 3001
      appProtocol: agentgateway.dev/mcp   # 경로 (c)용. 직접 LB 사용에는 무해

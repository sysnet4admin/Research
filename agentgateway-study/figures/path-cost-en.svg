<text x="311.0" y="199" font-size="9.5" fill="#2e6f9e" text-anchor="middle" font-weight="bold">6.3</text>
<text x="418" y="215" font-size="12.5" fill="#222" text-anchor="end" font-weight="bold">+0.2ms</text>
<text x="26" y="270" font-size="11" fill="#333">connection reuse</text>
<text x="26" y="284" font-size="10" fill="#888">100 rps</text>
<line x1="251.0" y1="268" x2="275.0" y2="268" stroke="#2e6f9e" stroke-width="4" opacity="0.45"/>
<circle cx="251.0" cy="268" r="5.5" fill="#8a8f98"/>
<circle cx="275.0" cy="268" r="5.5" fill="#2e6f9e"/>
<text x="251.0" y="289" font-size="9.5" fill="#777" text-anchor="middle">4.3</text>
<text x="275.0" y="257" font-size="9.5" fill="#2e6f9e" text-anchor="middle" font-weight="bold">5.1</text>
<text x="418" y="273" font-size="12.5" fill="#222" text-anchor="end" font-weight="bold">+0.8ms</text>
<text x="26" y="328" font-size="11" fill="#333">connection reuse</text>
<text x="26" y="342" font-size="10" fill="#888">200 rps</text>
<line x1="227.0" y1="326" x2="248.0" y2="326" stroke="#2e6f9e" stroke-width="4" opacity="0.45"/>

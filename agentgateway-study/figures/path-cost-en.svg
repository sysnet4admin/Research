<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Helvetica, Arial, sans-serif">
<rect width="920" height="470" fill="white"/>
<text x="460.0" y="30" font-size="14.5" fill="#111" text-anchor="middle" font-weight="bold">What each addition costs in latency (difference of median p50, n=5 each)</text>
<text x="460.0" y="50" font-size="11" fill="#777" text-anchor="middle">Each row = a same-day controlled pair. Dots = measured p50, right = difference of medians (tables report mean pair increments). Compare absolutes within a row only (days differ). p99 in the tables.</text>
<text x="226.0" y="84" font-size="12.5" fill="#111" text-anchor="middle" font-weight="bold">Q1. Adding the gateway hop?</text>
<text x="226.0" y="100" font-size="10.5" fill="#666" text-anchor="middle">direct call vs through the gateway</text>
<circle cx="66" cy="122" r="5" fill="#8a8f98"/>
<text x="76" y="126" font-size="10.5" fill="#333">direct</text>
<circle cx="236" cy="122" r="5" fill="#2e6f9e"/>
<text x="246" y="126" font-size="10.5" fill="#333">via gateway</text>
<line x1="122.0" y1="144" x2="122.0" y2="364" stroke="#eee"/>
<text x="122.0" y="378" font-size="9.5" fill="#999" text-anchor="middle">0</text>
<line x1="182.0" y1="144" x2="182.0" y2="364" stroke="#eee"/>
<text x="182.0" y="378" font-size="9.5" fill="#999" text-anchor="middle">2</text>
<line x1="242.0" y1="144" x2="242.0" y2="364" stroke="#eee"/>
<text x="242.0" y="378" font-size="9.5" fill="#999" text-anchor="middle">4</text>
<line x1="302.0" y1="144" x2="302.0" y2="364" stroke="#eee"/>
<text x="302.0" y="378" font-size="9.5" fill="#999" text-anchor="middle">6</text>
<line x1="362.0" y1="144" x2="362.0" y2="364" stroke="#eee"/>
<text x="362.0" y="378" font-size="9.5" fill="#999" text-anchor="middle">8</text>
<text x="242.0" y="394" font-size="10" fill="#777" text-anchor="middle">p50 (ms)</text>
<text x="26" y="154" font-size="11" fill="#333">new conn per call</text>
<text x="26" y="168" font-size="10" fill="#888">100 rps</text>
<line x1="353.0" y1="152" x2="362.0" y2="152" stroke="#2e6f9e" stroke-width="4" opacity="0.45"/>
<circle cx="353.0" cy="152" r="5.5" fill="#8a8f98"/>
<circle cx="362.0" cy="152" r="5.5" fill="#2e6f9e"/>

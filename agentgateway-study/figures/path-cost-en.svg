<text x="248.0" y="315" font-size="9.5" fill="#2e6f9e" text-anchor="middle" font-weight="bold">4.2</text>
<text x="418" y="331" font-size="12.5" fill="#222" text-anchor="end" font-weight="bold">+0.7ms</text>
<text x="26" y="414" font-size="10.5" fill="#555">Hop cost +0.2 to 0.8 ms; looms larger when clients reuse connections</text>
<text x="686.0" y="84" font-size="12.5" fill="#111" text-anchor="middle" font-weight="bold">Q2. Turning on guardrail argument checks?</text>
<text x="686.0" y="100" font-size="10.5" fill="#666" text-anchor="middle">adds a per-call gRPC round trip to the check server</text>
<circle cx="526" cy="122" r="5" fill="#8a8f98"/>
<text x="536" y="126" font-size="10.5" fill="#333">no check</text>
<circle cx="696" cy="122" r="5" fill="#6a4b9e"/>
<text x="706" y="126" font-size="10.5" fill="#333">check on (+gRPC round trip)</text>
<line x1="582.0" y1="144" x2="582.0" y2="364" stroke="#eee"/>
<text x="582.0" y="378" font-size="9.5" fill="#999" text-anchor="middle">0</text>
<line x1="642.0" y1="144" x2="642.0" y2="364" stroke="#eee"/>
<text x="642.0" y="378" font-size="9.5" fill="#999" text-anchor="middle">2</text>
<line x1="702.0" y1="144" x2="702.0" y2="364" stroke="#eee"/>

<text x="362.0" y="141" font-size="9.5" fill="#2e6f9e" text-anchor="middle" font-weight="bold">8.0</text>
<text x="418" y="157" font-size="12.5" fill="#222" text-anchor="end" font-weight="bold">+0.3ms</text>
<text x="26" y="212" font-size="11" fill="#333">new conn per call</text>
<text x="26" y="226" font-size="10" fill="#888">200 rps</text>
<line x1="305.0" y1="210" x2="311.0" y2="210" stroke="#2e6f9e" stroke-width="4" opacity="0.45"/>
<circle cx="305.0" cy="210" r="5.5" fill="#8a8f98"/>
<circle cx="311.0" cy="210" r="5.5" fill="#2e6f9e"/>

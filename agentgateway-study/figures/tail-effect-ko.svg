<text x="420.0" y="131.7" font-size="9.5" fill="#333" text-anchor="middle">217.2 / 216.3</text>
<line x1="295" y1="116" x2="313" y2="116" stroke="#8a8f98" stroke-width="2.2" stroke-dasharray="5,3"/>

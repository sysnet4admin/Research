<text x="560.0" y="261.7" font-size="9.5" fill="#c0504d" text-anchor="middle">16.3</text>
<text x="560.0" y="317.1" font-size="9.5" fill="#8a8f98" text-anchor="middle">8.9</text>
<text x="666.7" y="241.8" font-size="9.5" fill="#333" text-anchor="middle">21.7 / 24.2</text>
<text x="773.3" y="194.6" font-size="9.5" fill="#333" text-anchor="middle">61.5 / 62.0</text>
<text x="880.0" y="132.7" font-size="9.5" fill="#333" text-anchor="middle">212.5 / 212.6</text>
<line x1="755" y1="116" x2="773" y2="116" stroke="#8a8f98" stroke-width="2.2" stroke-dasharray="5,3"/>
<text x="779" y="120" font-size="10" fill="#333">직접 호출</text>
<line x1="755" y1="132" x2="773" y2="132" stroke="#c0504d" stroke-width="2.2"/>
<text x="779" y="136" font-size="10" fill="#333">게이트웨이 경유</text>
<text x="460.0" y="408" font-size="10.5" fill="#555" text-anchor="middle">v1.4.1에서 봤던 "게이트웨이가 꼬리를 평탄화한다"는 재현되지 않았다. 매번 새 연결에서는 두 선이 겹치고 연결 재사용의 꼬리 손해(0ms에서 8.9 대 16.3ms)는 백엔드가 느려질수록 사라진다. p50 비용은 본문 표에서 전 구간 1ms 아래다.</text>
</svg>

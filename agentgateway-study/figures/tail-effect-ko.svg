<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Helvetica, Arial, sans-serif">
<rect width="920" height="430" fill="white"/>
<text x="460.0" y="30" font-size="14.5" fill="#111" text-anchor="middle" font-weight="bold">게이트웨이를 거치면 꼬리(p99)가 어떻게 되는가: 백엔드 처리 시간별</text>
<text x="460.0" y="50" font-size="10.5" fill="#666" text-anchor="middle">직접 호출과 게이트웨이 경유, 각 5회 중앙값. 100rps, 서버 쪽 echo 지연 0/10/50/200ms, 30초 셀.</text>
<text x="460.0" y="78" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">p99 절대값: 직접 호출 대 게이트웨이 경유 (로그 눈금)</text>
<text x="260.0" y="100" font-size="12" fill="#2e6f9e" text-anchor="middle" font-weight="bold">연결 매번 새로</text>

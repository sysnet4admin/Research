<text x="514" y="299.2" font-size="9.5" fill="#666" text-anchor="end">10ms</text>
<line x1="520" y1="260.4" x2="920" y2="260.4" stroke="#eee"/>
<text x="514" y="264.4" font-size="9.5" fill="#666" text-anchor="end">20ms</text>
<line x1="520" y1="214.4" x2="920" y2="214.4" stroke="#eee"/>
<text x="514" y="218.4" font-size="9.5" fill="#666" text-anchor="end">50ms</text>
<line x1="520" y1="179.6" x2="920" y2="179.6" stroke="#eee"/>
<text x="514" y="183.6" font-size="9.5" fill="#666" text-anchor="end">100ms</text>
<line x1="520" y1="144.8" x2="920" y2="144.8" stroke="#eee"/>

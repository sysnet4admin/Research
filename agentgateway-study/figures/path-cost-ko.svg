<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Helvetica, Arial, sans-serif">
<rect width="920" height="470" fill="white"/>
<text x="460.0" y="30" font-size="14.5" fill="#111" text-anchor="middle" font-weight="bold">무엇을 더하면 지연이 얼마나 느는가 (p50 중앙값의 차이, 각 5회)</text>
<text x="460.0" y="50" font-size="11" fill="#777" text-anchor="middle">각 행 = 같은 날 잰 통제 쌍. 점 = 실측 p50 절대값, 오른쪽 = 뒤 값에서 앞 값을 뺀 중앙값 차이(본문 표의 증분은 짝 평균). 절대값 비교는 행 안에서만(측정일 상이). p99는 본문 표.</text>
<text x="226.0" y="84" font-size="12.5" fill="#111" text-anchor="middle" font-weight="bold">질문 1. 게이트웨이를 거치면?</text>

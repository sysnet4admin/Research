# 트레이싱 수집기. agentgateway 프록시와 같은 네임스페이스에 둔다(교차 네임스페이스
# backendRef의 ReferenceGrant를 피하려는 것). debug exporter가 스팬을 로그로 찍고
# 러너가 그 로그에서 부모 관계를 읽는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: agentgateway-system
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch:
        timeout: 1s
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: agentgateway-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      containers:
        - name: collector
          image: docker.io/otel/opentelemetry-collector:0.160.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - containerPort: 4317
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: conf, mountPath: /conf }
      volumes:
        - name: conf
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: agentgateway-system
spec:
  selector: { app: otel-collector }
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      appProtocol: kubernetes.io/h2c

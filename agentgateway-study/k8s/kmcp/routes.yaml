# 두 게이트웨이에 kmcp 를 새 경로로 붙인다. 기존 라우트(/b, /mcp)와 셀은 건드리지 않는다.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata: { name: kmcp, namespace: mcp-pilot }
spec:
  mcp:
    sessionRouting: Stateless
    targets:
      - name: kmcp
        selector:
          services:
            matchLabels: { app: kmcp }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: kmcp, namespace: mcp-pilot }
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: agentgateway-proxy, namespace: agentgateway-system }
  rules:
    - matches: [{ path: { type: PathPrefix, value: /k } }]
      backendRefs: [{ group: agentgateway.dev, kind: AgentgatewayBackend, name: kmcp }]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata: { name: kmcp, namespace: mcp-pilot }
spec:
  endpoints:
    - fqdn: { hostname: kmcp.mcp-pilot.svc.cluster.local, port: 80 }
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata: { name: ar-kmcp, namespace: mcp-pilot }
spec:
  parentRefs: [{ name: ar-gw, kind: Gateway, group: gateway.networking.k8s.io }]
  path: /kmcp
  backendRefs: [{ name: kmcp, kind: Backend, group: gateway.envoyproxy.io, path: /mcp }]

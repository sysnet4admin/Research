<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="548" fill="white"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<text x="450.0" y="32" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">MCP and A2A differ in what sits on the other end</text>
<text x="450.0" y="52" font-size="11" fill="#777" text-anchor="middle">They do not overlap, so you pick by what you are doing.</text>
<rect x="56" y="78" width="788" height="248" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1.2"/>
<rect x="174" y="78" width="335" height="32" fill="#eef1f6"/>
<rect x="509" y="78" width="335" height="32" fill="#326CE5"/>
<text x="341.5" y="99" font-size="13" fill="#3c4655" text-anchor="middle" font-weight="bold">MCP</text>
<text x="676.5" y="99" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">A2A</text>
<line x1="174" y1="78" x2="174" y2="326" stroke="#ddd" stroke-width="1"/>
<line x1="509" y1="78" x2="509" y2="326" stroke="#ddd" stroke-width="1"/>
<rect x="56" y="110" width="118" height="54" fill="#fafafa"/>
<text x="115.0" y="141.0" font-size="11" fill="#555" text-anchor="middle" font-weight="bold">the other end</text>
<text x="341.5" y="141.0" font-size="10.5" fill="#333" text-anchor="middle">tools and resources</text>
<text x="676.5" y="141.0" font-size="10.5" fill="#333" text-anchor="middle">another agent</text>
<line x1="56" y1="164" x2="844" y2="164" stroke="#eee" stroke-width="1"/>
<rect x="56" y="164" width="118" height="54" fill="#fafafa"/>
<text x="115.0" y="195.0" font-size="11" fill="#555" text-anchor="middle" font-weight="bold">the model</text>
<text x="341.5" y="195.0" font-size="10.5" fill="#333" text-anchor="middle">call it, a result comes back</text>
<text x="676.5" y="188.0" font-size="10.5" fill="#333" text-anchor="middle">takes work and spends time on it</text>
<text x="676.5" y="202.0" font-size="10.5" fill="#333" text-anchor="middle">may ask a question or refuse</text>
<line x1="56" y1="218" x2="844" y2="218" stroke="#eee" stroke-width="1"/>
<rect x="56" y="218" width="118" height="54" fill="#fafafa"/>
<text x="115.0" y="249.0" font-size="11" fill="#555" text-anchor="middle" font-weight="bold">what it has</text>
<text x="341.5" y="242.0" font-size="10.5" fill="#333" text-anchor="middle">tool listing (tools/list)</text>
<text x="341.5" y="256.0" font-size="10.5" fill="#333" text-anchor="middle">tool calls (tools/call)</text>
<text x="676.5" y="242.0" font-size="10.5" fill="#333" text-anchor="middle">cards, tasks</text>
<text x="676.5" y="256.0" font-size="10.5" fill="#333" text-anchor="middle">state changes (get, subscribe, push), cancel</text>
<line x1="56" y1="272" x2="844" y2="272" stroke="#eee" stroke-width="1"/>
<rect x="56" y="272" width="118" height="54" fill="#fafafa"/>
<text x="115.0" y="303.0" font-size="11" fill="#555" text-anchor="middle" font-weight="bold">what it lacks</text>
<text x="341.5" y="296.0" font-size="10.5" fill="#333" text-anchor="middle">state of work in flight</text>
<text x="341.5" y="310.0" font-size="10.5" fill="#333" text-anchor="middle">mid-flight input, cancellation</text>
<text x="676.5" y="303.0" font-size="10.5" fill="#333" text-anchor="middle">any notion of a tool list</text>
<text x="56" y="354" font-size="11" fill="#777" text-anchor="start" font-weight="bold">pick by what you are doing</text>
<rect x="56" y="360" width="788" height="140" rx="6" fill="#fbfcfe" stroke="#dde3ee" stroke-width="1.5"/>
<rect x="82" y="413.0" width="150" height="40" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="157.0" y="437.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">my agent</text>
<rect x="386" y="386" width="150" height="40" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<text x="461.0" y="410.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">tools and resources</text>
<path d="M238,433.0 H276 V406.0 H378" fill="none" stroke="#7b8ca5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="267.6" y="387.0" width="126.80000000000001" height="14" fill="white"/>
<text x="331.0" y="397.0" font-size="9" fill="#777" text-anchor="middle">MCP: use a tool yourself</text>
<rect x="386" y="440" width="150" height="40" rx="6" fill="#fafafa" stroke="#326CE5" stroke-width="1.5"/>
<text x="461.0" y="464.0" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">the other agent</text>
<path d="M238,433.0 H276 V460.0 H378" fill="none" stroke="#326CE5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="252.75" y="441.0" width="156.5" height="14" fill="white"/>
<text x="331.0" y="451.0" font-size="9" fill="#777" text-anchor="middle">A2A: hand work to someone else</text>
<rect x="616" y="440" width="150" height="40" rx="6" fill="#f7f7f7" stroke="#dcdcdc" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="691.0" y="464.0" font-size="11" fill="#999" text-anchor="middle">tools and resources</text>
<line x1="542" y1="460.0" x2="608" y2="460.0" stroke="#bbb" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="4 3"/>
<rect x="529.925" y="442.5" width="92.15" height="13.5" fill="white"/>
<text x="576.0" y="452.0" font-size="8.5" fill="#999" text-anchor="middle">its own tools, MCP</text>
<text x="450.0" y="516" font-size="10" fill="#555" text-anchor="middle">These are a choice, not a sequence. Using a tool yourself needs only MCP; A2A is for handing work to someone else. That the other agent calls its own tools is</text>
<text x="450.0" y="531" font-size="10" fill="#555" text-anchor="middle">its business, not a leg of your path.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="430" fill="white"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#326CE5"/></marker></defs>
<text x="450.0" y="32" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">What you can do while a 15-second job runs</text>
<text x="450.0" y="52" font-size="11" fill="#777" text-anchor="middle">All three took 15.1-15.2 s. What differs is the round trips in between.</text>
<text x="250" y="84" font-size="9.5" fill="#888" text-anchor="middle">handed off</text>
<text x="800" y="84" font-size="9.5" fill="#888" text-anchor="middle">result</text>
<line x1="250" y1="90" x2="250" y2="356" stroke="#e3e3e3" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="800" y1="90" x2="800" y2="356" stroke="#e3e3e3" stroke-width="1" stroke-dasharray="3 3"/>
<text x="30" y="106" font-size="12" fill="#222" text-anchor="start" font-weight="bold">polling on HTTP and MCP</text>
<text x="30" y="123" font-size="9" fill="#888" text-anchor="start">a status call built by hand. 92 B each</text>
<line x1="250" y1="110" x2="800" y2="110" stroke="#ccc" stroke-width="2"/>
<circle cx="250" cy="110" r="4.5" fill="#555"/>
<circle cx="800" cy="110" r="4.5" fill="#7b8ca5"/>
<line x1="341.6666666666667" y1="110" x2="341.6666666666667" y2="88" stroke="#7b8ca5" stroke-width="1.4"/>
<circle cx="341.6666666666667" cy="86" r="3.5" fill="#7b8ca5"/>
<line x1="433.33333333333337" y1="110" x2="433.33333333333337" y2="88" stroke="#7b8ca5" stroke-width="1.4"/>
<circle cx="433.33333333333337" cy="86" r="3.5" fill="#7b8ca5"/>
<line x1="525.0" y1="110" x2="525.0" y2="88" stroke="#7b8ca5" stroke-width="1.4"/>
<circle cx="525.0" cy="86" r="3.5" fill="#7b8ca5"/>
<line x1="616.6666666666667" y1="110" x2="616.6666666666667" y2="88" stroke="#7b8ca5" stroke-width="1.4"/>
<circle cx="616.6666666666667" cy="86" r="3.5" fill="#7b8ca5"/>
<line x1="708.3333333333334" y1="110" x2="708.3333333333334" y2="88" stroke="#7b8ca5" stroke-width="1.4"/>
<circle cx="708.3333333333334" cy="86" r="3.5" fill="#7b8ca5"/>
<text x="525.0" y="76" font-size="9.5" fill="#7b8ca5" text-anchor="middle">check마다 92B</text>
<text x="30" y="204" font-size="12" fill="#222" text-anchor="start" font-weight="bold">polling on A2A</text>
<text x="30" y="221" font-size="9" fill="#888" text-anchor="start">the whole task object rides along. 571 B each</text>
<line x1="250" y1="208" x2="800" y2="208" stroke="#ccc" stroke-width="2"/>
<circle cx="250" cy="208" r="4.5" fill="#555"/>
<circle cx="800" cy="208" r="4.5" fill="#d9822b"/>
<line x1="341.6666666666667" y1="208" x2="341.6666666666667" y2="186" stroke="#d9822b" stroke-width="1.4"/>
<circle cx="341.6666666666667" cy="184" r="3.5" fill="#d9822b"/>
<line x1="433.33333333333337" y1="208" x2="433.33333333333337" y2="186" stroke="#d9822b" stroke-width="1.4"/>
<circle cx="433.33333333333337" cy="184" r="3.5" fill="#d9822b"/>
<line x1="525.0" y1="208" x2="525.0" y2="186" stroke="#d9822b" stroke-width="1.4"/>
<circle cx="525.0" cy="184" r="3.5" fill="#d9822b"/>
<line x1="616.6666666666667" y1="208" x2="616.6666666666667" y2="186" stroke="#d9822b" stroke-width="1.4"/>
<circle cx="616.6666666666667" cy="184" r="3.5" fill="#d9822b"/>
<line x1="708.3333333333334" y1="208" x2="708.3333333333334" y2="186" stroke="#d9822b" stroke-width="1.4"/>
<circle cx="708.3333333333334" cy="184" r="3.5" fill="#d9822b"/>
<text x="525.0" y="174" font-size="9.5" fill="#d9822b" text-anchor="middle">check마다 571B</text>
<text x="30" y="302" font-size="12" fill="#222" text-anchor="start" font-weight="bold">A2A streaming and push</text>
<text x="30" y="319" font-size="9" fill="#888" text-anchor="start">you do not go and check. the server sends</text>
<line x1="250" y1="306" x2="800" y2="306" stroke="#ccc" stroke-width="2"/>
<circle cx="250" cy="306" r="4.5" fill="#555"/>
<circle cx="800" cy="306" r="4.5" fill="#326CE5"/>
<line x1="360" y1="336" x2="360" y2="311" stroke="#326CE5" stroke-width="1.4" marker-end="url(#ab)"/>
<circle cx="360" cy="338" r="3.5" fill="#326CE5"/>
<line x1="490" y1="336" x2="490" y2="311" stroke="#326CE5" stroke-width="1.4" marker-end="url(#ab)"/>
<circle cx="490" cy="338" r="3.5" fill="#326CE5"/>
<line x1="620" y1="336" x2="620" y2="311" stroke="#326CE5" stroke-width="1.4" marker-end="url(#ab)"/>
<circle cx="620" cy="338" r="3.5" fill="#326CE5"/>
<line x1="780" y1="336" x2="780" y2="311" stroke="#326CE5" stroke-width="1.4" marker-end="url(#ab)"/>
<circle cx="780" cy="338" r="3.5" fill="#326CE5"/>
<text x="525.0" y="360" font-size="9.5" fill="#326CE5" text-anchor="middle">event / one push</text>
<rect x="460.9125" y="281.5" width="128.175" height="14.5" fill="white"/>
<text x="525.0" y="292" font-size="9.5" fill="#326CE5" text-anchor="middle">zero status round trips</text>
<text x="450.0" y="386" font-size="9.5" fill="#777" text-anchor="middle">On polling alone A2A is the most expensive. But A2A does not have to poll: streaming and</text>
<text x="450.0" y="399" font-size="9.5" fill="#777" text-anchor="middle">push are in the spec, which takes the status round trips to zero. Doing the same on the</text>
<text x="450.0" y="412" font-size="9.5" fill="#777" text-anchor="middle">other two means building an SSE endpoint and a webhook sender yourself.</text>
</svg>

<rect x="364.2375" y="141.5" width="115.525" height="13.5" fill="white"/>
<text x="422.0" y="151.0" font-size="8.5" fill="#777" text-anchor="middle">어디로 보낼지 알려 준다</text>
<line x1="544.0" y1="200" x2="544.0" y2="244" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="509.6125" y="216.5" width="68.775" height="13.5" fill="white"/>
<text x="544.0" y="226.0" font-size="8.5" fill="#777" text-anchor="middle">보내면 생긴다</text>
<line x1="448" y1="288.0" x2="394" y2="288.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="387.6125" y="271.5" width="68.775" height="13.5" fill="white"/>
<text x="422.0" y="281.0" font-size="8.5" fill="#777" text-anchor="middle">끝나면 남는다</text>
<rect x="706" y="158" width="170" height="182" rx="6" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="791.0" y="180" font-size="12" fill="#555" text-anchor="middle" font-weight="bold">상대 에이전트</text>
<text x="791.0" y="196" font-size="9" fill="#999" text-anchor="middle">일을 맡는다</text>
<rect x="726" y="210" width="130" height="20" rx="4" fill="#e9e9e9" stroke="#dcdcdc" stroke-width="1"/>
<text x="791.0" y="224" font-size="9.5" fill="#999" text-anchor="middle">도구</text>
<rect x="726" y="236" width="130" height="20" rx="4" fill="#e9e9e9" stroke="#dcdcdc" stroke-width="1"/>
<text x="791.0" y="250" font-size="9.5" fill="#999" text-anchor="middle">메모리</text>
<rect x="726" y="262" width="130" height="20" rx="4" fill="#e9e9e9" stroke="#dcdcdc" stroke-width="1"/>
<text x="791.0" y="276" font-size="9.5" fill="#999" text-anchor="middle">모델</text>
<rect x="726" y="288" width="130" height="20" rx="4" fill="#e9e9e9" stroke="#dcdcdc" stroke-width="1"/>
<text x="791.0" y="302" font-size="9.5" fill="#999" text-anchor="middle">내부 계획</text>
<text x="791.0" y="332" font-size="9.5" fill="#999" text-anchor="middle">보이지 않는다</text>
<line x1="160" y1="239" x2="190" y2="239" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="654" y1="240" x2="700" y2="240" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<text x="450.0" y="424" font-size="10" fill="#555" text-anchor="middle">이 연구가 확인하는 것은 이 넷이 스펙대로 동작하는가이다. 카드의 선언이 실제로 강제되는가(선언 대 실제), 태스크가 있어서 HTTP나 MCP로 만들 때와 무엇이</text>
<text x="450.0" y="439" font-size="10" fill="#555" text-anchor="middle">달라지는가(대안 대비).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="470" fill="white"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<text x="450.0" y="32" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">One header splits the same address into two generations</text>
<text x="450.0" y="52" font-size="11" fill="#777" text-anchor="middle">Omit it and you get v0.3, not an error.</text>
<text x="44" y="80" font-size="10.5" fill="#888" text-anchor="start" font-weight="bold">client request</text>
<rect x="44" y="92" width="196" height="52" rx="6" fill="#fff7f2" stroke="#d9822b" stroke-width="1.5"/>
<text x="142.0" y="114" font-size="11.5" fill="#222" text-anchor="middle" font-weight="bold">no header</text>
<text x="142.0" y="130" font-size="9" fill="#888" text-anchor="middle">A2A-Version not sent</text>
<rect x="44" y="168" width="196" height="52" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="142.0" y="190" font-size="11.5" fill="#222" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">A2A-Version: 0.3</text>
<text x="142.0" y="206" font-size="9" fill="#888" text-anchor="middle">asks for the old one</text>
<rect x="44" y="244" width="196" height="52" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="142.0" y="266" font-size="11.5" fill="#222" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">A2A-Version: 1.0</text>
<text x="142.0" y="282" font-size="9" fill="#888" text-anchor="middle">asks for the new one</text>
<rect x="356" y="92" width="150" height="204" rx="6" fill="#ffffff" stroke="#326CE5" stroke-width="1.6"/>
<rect x="356" y="92" width="150" height="26" rx="6" fill="#326CE5"/>
<rect x="356" y="108" width="150" height="10" fill="#326CE5"/>
<text x="431.0" y="110" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">one server</text>
<text x="431.0" y="208" font-size="10" fill="#555" text-anchor="middle" font-family="Menlo, monospace">/a2a/jsonrpc</text>
<text x="431.0" y="226" font-size="9.5" fill="#999" text-anchor="middle">v0.3 + v1.0</text>
<text x="640" y="80" font-size="10.5" fill="#888" text-anchor="start" font-weight="bold">generation used</text>
<rect x="640" y="104" width="216" height="62" rx="6" fill="#fafafa" stroke="#b5b5b5" stroke-width="1.5"/>
<text x="748.0" y="128" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">handled as v0.3</text>
<text x="748.0" y="146" font-size="9" fill="#777" text-anchor="middle">old method names, old state</text>
<text x="748.0" y="157" font-size="9" fill="#777" text-anchor="middle">names</text>
<rect x="640" y="214" width="216" height="62" rx="6" fill="#fafafa" stroke="#326CE5" stroke-width="1.5"/>
<text x="748.0" y="238" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">handled as v1.0</text>
<text x="748.0" y="256" font-size="9" fill="#777" text-anchor="middle">new names, new shape</text>
<line x1="246" y1="118.0" x2="348" y2="118.0" stroke="#d9822b" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="246" y1="194.0" x2="348" y2="194.0" stroke="#7b8ca5" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="246" y1="270.0" x2="348" y2="270.0" stroke="#7b8ca5" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="512" y1="135.0" x2="632" y2="135.0" stroke="#7b8ca5" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="512" y1="245.0" x2="632" y2="245.0" stroke="#326CE5" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="526.925" y="116.0" width="92.15" height="14" fill="white"/>
<text x="573.0" y="126.0" font-size="9" fill="#d9822b" text-anchor="middle">no error, no sign</text>
<text x="44" y="322" font-size="11" fill="#777" text-anchor="start" font-weight="bold">REST splits by path too, and the names read backwards</text>
<rect x="44" y="330" width="812" height="66" rx="6" fill="#fbfcfe" stroke="#dde3ee" stroke-width="1.5"/>
<text x="84" y="360" font-size="12" fill="#333" text-anchor="start" font-family="Menlo, monospace">/a2a/rest/</text>
<line x1="214" y1="356" x2="270" y2="356" stroke="#7b8ca5" stroke-width="1.6" marker-end="url(#a)"/>
<text x="300" y="360" font-size="12.5" fill="#326CE5" text-anchor="start" font-weight="bold">v1.0</text>
<text x="484" y="360" font-size="12" fill="#333" text-anchor="start" font-family="Menlo, monospace">/a2a/rest/v1/</text>
<line x1="614" y1="356" x2="670" y2="356" stroke="#7b8ca5" stroke-width="1.6" marker-end="url(#a)"/>
<text x="700" y="360" font-size="12.5" fill="#777" text-anchor="start" font-weight="bold">v0.3</text>
<text x="450.0" y="428" font-size="9.5" fill="#777" text-anchor="middle">JSON-RPC splits on the header alone, at one address. Spec 3.6.1 says clients MUST send the</text>
<text x="450.0" y="441" font-size="9.5" fill="#777" text-anchor="middle">header and, in the same sentence, that an absent header means v0.3. So a v1.0 client that</text>
<text x="450.0" y="454" font-size="9.5" fill="#777" text-anchor="middle">forgets it gets normal responses while being served the older generation.</text>
</svg>

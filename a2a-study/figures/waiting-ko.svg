<rect x="479.2" y="281.5" width="91.60000000000001" height="14.5" fill="white"/>
<text x="525.0" y="292" font-size="9.5" fill="#326CE5" text-anchor="middle">상태 확인 왕복 0</text>
<text x="450.0" y="386" font-size="9.5" fill="#777" text-anchor="middle">폴링만 놓고 보면 A2A가 가장 비싸다. 그런데 A2A는 폴링을 하지 않아도 된다. 스트리밍과 푸시가</text>
<text x="450.0" y="399" font-size="9.5" fill="#777" text-anchor="middle">스펙 안에 있어서 확인하러 가는 왕복이 0이 된다. 다른 두 구현에서 같은 것을 하려면 SSE</text>
<text x="450.0" y="412" font-size="9.5" fill="#777" text-anchor="middle">엔드포인트와 웹훅 발송 기능을 직접 만들어야 한다. 확인 횟수는 얼마나 자주 묻느냐에 달렸고</text>
<text x="450.0" y="425" font-size="9.5" fill="#777" text-anchor="middle">그림에서는 5회를 예로 들었다.</text>

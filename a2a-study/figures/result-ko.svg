<text x="450.0" y="358" font-size="10" fill="#555" text-anchor="middle">왼쪽이 얻는 것이고 오른쪽 둘이 드는 것이다. 파란 막대가 왼쪽에서는 가장 짧고 오른쪽에서는 가장 길다. 바이트가 큰 것은 태스크 객체를 매번 싣기 때문이다. 짧은</text>

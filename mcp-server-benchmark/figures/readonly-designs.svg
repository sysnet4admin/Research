<svg xmlns="http://www.w3.org/2000/svg" width="800" height="468" viewBox="0 0 800 468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif" role="img" aria-label="Where does read-only block writes? Three designs">
<rect width="800" height="468" fill="#ffffff"/>
<text x="24.0" y="30.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600">Where does read-only block writes? Three designs</text>
<text x="24.0" y="48.0" font-size="11.5" fill="#59636e" text-anchor="start" font-weight="normal">the gate position decides whether you save tokens as well as safety</text>
<text x="24.0" y="112.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">registration-time block</text>
<text x="24.0" y="128.0" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">reza, containers, Flux159</text>
<rect x="210" y="92" width="120" height="48" rx="6" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="270.0" y="120.0" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">Agent (LLM)</text>
<rect x="430" y="92" width="130" height="48" rx="6" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="495.0" y="120.0" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">MCP server</text>
<rect x="650" y="92" width="110" height="48" rx="6" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="705.0" y="120.0" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">cluster</text>
<line x1="560" y1="116" x2="650" y2="116" stroke="#59636e" stroke-width="1.4"/>
<path d="M 644 112 L 650 116 L 644 120" stroke="#59636e" fill="none" stroke-width="1.4"/>
<text x="605.0" y="111.0" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">kubectl / API</text>
<line x1="430" y1="108" x2="330" y2="108" stroke="#1a7f37" stroke-width="1.8"/>
<path d="M 336 104 L 330 108 L 336 112" stroke="#1a7f37" fill="none" stroke-width="1.8"/>
<text x="380.0" y="103.0" font-size="9.5" fill="#1a7f37" text-anchor="middle" font-weight="normal">trimmed list</text>
<rect x="424" y="92" width="8" height="32" rx="2" fill="#cf222e"/>
<text x="428.0" y="113.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">✕</text>
<text x="210.0" y="162.0" font-size="10.5" fill="#1a7f37" text-anchor="start" font-weight="normal">write tools never enter the list: the agent cannot even see them, and tokens shrink</text>
<text x="24.0" y="244.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">call-time block</text>
<text x="24.0" y="260.0" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">rohitg00</text>
<rect x="210" y="224" width="120" height="48" rx="6" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="270.0" y="252.0" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">Agent (LLM)</text>
<rect x="430" y="224" width="130" height="48" rx="6" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="495.0" y="252.0" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">MCP server</text>
<rect x="650" y="224" width="110" height="48" rx="6" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="705.0" y="252.0" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">cluster</text>
<line x1="560" y1="248" x2="650" y2="248" stroke="#59636e" stroke-width="1.4"/>
<path d="M 644 244 L 650 248 L 644 252" stroke="#59636e" fill="none" stroke-width="1.4"/>
<text x="605.0" y="243.0" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">kubectl / API</text>
<line x1="430" y1="236" x2="330" y2="236" stroke="#9a6700" stroke-width="2.6"/>
<path d="M 336 232 L 330 236 L 336 240" stroke="#9a6700" fill="none" stroke-width="2.6"/>
<text x="380.0" y="231.0" font-size="9.5" fill="#9a6700" text-anchor="middle" font-weight="normal">full list, 275 tools (tokens paid)</text>
<line x1="330" y1="258" x2="416" y2="258" stroke="#cf222e" stroke-width="1.6"/>
<path d="M 410 254 L 416 258 L 410 262" stroke="#cf222e" fill="none" stroke-width="1.6"/>
<text x="373.0" y="271.0" font-size="9.5" fill="#cf222e" text-anchor="middle" font-weight="normal">write call</text>
<rect x="418" y="242" width="8" height="32" rx="2" fill="#cf222e"/>
<text x="422.0" y="263.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">✕</text>
<text x="432.0" y="290.0" font-size="9.5" fill="#cf222e" text-anchor="start" font-weight="normal">refused</text>
<text x="210.0" y="306.0" font-size="10.5" fill="#cf222e" text-anchor="start" font-weight="normal">safety holds, but every definition already rode into the context window</text>
<text x="24.0" y="376.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="600">structural</text>
<text x="24.0" y="392.0" font-size="10" fill="#59636e" text-anchor="start" font-weight="normal">mcp-kubernetes-ro</text>
<rect x="210" y="356" width="120" height="48" rx="6" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="270.0" y="384.0" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">Agent (LLM)</text>
<rect x="430" y="356" width="130" height="48" rx="6" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="495.0" y="373.0" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">MCP server</text>
<text x="495.0" y="389.0" font-size="10" fill="#59636e" text-anchor="middle" font-weight="normal">read tools only</text>
<rect x="650" y="356" width="110" height="48" rx="6" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="705.0" y="384.0" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">cluster</text>
<line x1="560" y1="380" x2="650" y2="380" stroke="#59636e" stroke-width="1.4"/>
<path d="M 644 376 L 650 380 L 644 384" stroke="#59636e" fill="none" stroke-width="1.4"/>
<text x="605.0" y="375.0" font-size="9.5" fill="#59636e" text-anchor="middle" font-weight="normal">kubectl / API</text>
<line x1="430" y1="372" x2="330" y2="372" stroke="#1a7f37" stroke-width="1.6"/>
<path d="M 336 368 L 330 372 L 336 376" stroke="#1a7f37" fill="none" stroke-width="1.6"/>
<text x="380.0" y="367.0" font-size="9.5" fill="#1a7f37" text-anchor="middle" font-weight="normal">tool list</text>
<text x="210.0" y="426.0" font-size="10.5" fill="#1a7f37" text-anchor="start" font-weight="normal">nothing to block: the server has no write path at all</text>

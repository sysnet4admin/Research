<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" width="900" height="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5651d"/></marker></defs>
<rect width="900" height="376" fill="white"/>
<text x="450.0" y="32" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">인자 값을 조건으로 걸면 목록이 비는 이유</text>
<text x="450.0" y="54" font-size="11.5" fill="#777" text-anchor="middle">목록을 거를 때 프록시는 도구마다 호출을 가정하고 묻는다.</text>
<rect x="16" y="96" width="132" height="70" rx="6" fill="#f4f7fb" stroke="#8aa" stroke-width="1.5"/>
<text x="82.0" y="118" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">클라이언트</text>
<text x="82.0" y="140.11" font-size="8" fill="#777" text-anchor="middle" font-family="Menlo, monospace">tools/list</text>
<text x="82.0" y="150.61" font-size="8" fill="#777" text-anchor="middle" font-family="Menlo, monospace">params: {}</text>
<rect x="164" y="96" width="132" height="70" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.5"/>
<text x="230.0" y="118" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">도구마다 묻는다</text>
<text x="230.0" y="140.11" font-size="8" fill="#777" text-anchor="middle" font-family="Menlo, monospace">method = "tools/call"</text>
<text x="230.0" y="150.61" font-size="8" fill="#777" text-anchor="middle" font-family="Menlo, monospace">params = 목록 요청의 params</text>
<line x1="150" y1="131.0" x2="161" y2="131.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="312" y="96" width="132" height="70" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.5"/>
<text x="378.0" y="118" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">CEL 평가</text>
<text x="378.0" y="140.11" font-size="8" fill="#777" text-anchor="middle" font-family="Menlo, monospace">request.mcp.params</text>
<text x="378.0" y="150.61" font-size="8" fill="#777" text-anchor="middle" font-family="Menlo, monospace">  .arguments.a == 1</text>
<line x1="298" y1="131.0" x2="309" y2="131.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="460" y="96" width="132" height="70" rx="6" fill="#fdf3e7" stroke="#c96" stroke-width="1.5"/>
<text x="526.0" y="118" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">규칙을 건너뛴다</text>
<text x="526.0" y="145.36" font-size="8" fill="#777" text-anchor="middle">CEL 오류면 continue</text>
<line x1="446" y1="131.0" x2="457" y2="131.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="608" y="96" width="132" height="70" rx="6" fill="#fdf3e7" stroke="#c96" stroke-width="1.5"/>
<text x="674.0" y="118" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">defaultAction</text>
<text x="674.0" y="145.36" font-size="8" fill="#777" text-anchor="middle">기본값 Deny</text>
<line x1="594" y1="131.0" x2="605" y2="131.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="752" y="96" width="132" height="70" rx="6" fill="#fbecec" stroke="#c66" stroke-width="1.5"/>
<text x="818.0" y="118" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">목록 0개</text>
<text x="818.0" y="140.11" font-size="8" fill="#777" text-anchor="middle">백엔드의 도구 8개가</text>
<text x="818.0" y="150.61" font-size="8" fill="#777" text-anchor="middle">모두 사라진다</text>
<line x1="738" y1="131.0" x2="749" y2="131.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<text x="378.0" y="190" font-size="9.5" fill="#c33" text-anchor="middle" font-family="Menlo, monospace">no such key: arguments</text>
<line x1="448.34000000000003" y1="186" x2="526.0" y2="186" stroke="#c33" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="16" y="208" width="868" height="84" rx="8" fill="#f2f7f2" stroke="#7a9" stroke-width="1.5"/>
<text x="450" y="234" font-size="12.5" fill="#2c5" text-anchor="middle" font-weight="bold">되돌리는 방법</text>
<text x="450" y="256" font-size="9.5" fill="#567" text-anchor="middle" font-family="Menlo, monospace">!has(request.mcp.params.arguments) ||</text>
<text x="450" y="269" font-size="9.5" fill="#567" text-anchor="middle" font-family="Menlo, monospace">를 앞에 붙이면 목록 시점에는 왼쪽만 평가하고 끝난다</text>
<text x="450.0" y="336.0" font-size="9.5" fill="#777" text-anchor="middle">호출은 되는데 목록에 없다.</text>
<text x="450.0" y="349.5" font-size="9.5" fill="#777" text-anchor="middle">에이전트는 tools/list를 보고 무엇을 호출할지 정하므로 도구가 있는 줄 모르면 통과할 호출도 하지 않는다.</text>
</svg>

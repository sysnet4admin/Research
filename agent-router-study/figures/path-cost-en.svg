<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5651d"/></marker></defs>
<rect width="900" height="502" fill="white"/>
<text x="450.0" y="32" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">99% of the passthrough cost comes from the MCP proxy</text>
<text x="450.0" y="54" font-size="11.5" fill="#777" text-anchor="middle">A route through the same Envoy that skips only the MCP proxy serves as the control.</text>
<text x="46" y="88" font-size="10" fill="#999" text-anchor="start">Path</text>
<text x="470" y="88" font-size="10" fill="#999" text-anchor="middle">Throughput at 1</text>
<text x="570" y="88" font-size="10" fill="#999" text-anchor="middle">Latency p50</text>
<text x="46" y="116" font-size="11.5" fill="#333" text-anchor="start">Backend directly</text>
<text x="470" y="116" font-size="11" fill="#555" text-anchor="middle">806 rps</text>
<text x="570" y="116" font-size="11.5" fill="#4a7c59" text-anchor="middle" font-weight="bold">0.91ms</text>
<rect x="630" y="105" width="9.613333333333333" height="14" rx="3" fill="#4a7c59" opacity="0.75"/>
<text x="46" y="168" font-size="11.5" fill="#333" text-anchor="start">Same Envoy, no MCP proxy</text>
<text x="470" y="168" font-size="11" fill="#555" text-anchor="middle">755 rps</text>
<text x="570" y="168" font-size="11.5" fill="#4a7c59" text-anchor="middle" font-weight="bold">1.06ms</text>
<rect x="630" y="157" width="11.19794871794872" height="14" rx="3" fill="#4a7c59" opacity="0.75"/>
<text x="46" y="220" font-size="11.5" fill="#333" text-anchor="start">Through the MCP proxy (default)</text>
<text x="470" y="220" font-size="11" fill="#555" text-anchor="middle">50 rps</text>
<text x="570" y="220" font-size="11.5" fill="#b5651d" text-anchor="middle" font-weight="bold">19.5ms</text>
<rect x="630" y="209" width="206.0" height="14" rx="3" fill="#b5651d" opacity="0.75"/>
<text x="46" y="272" font-size="11.5" fill="#333" text-anchor="start">Same path, iteration count at 1,000</text>
<text x="470" y="272" font-size="11" fill="#555" text-anchor="middle">596 rps</text>
<text x="570" y="272" font-size="11.5" fill="#4a7c59" text-anchor="middle" font-weight="bold">1.55ms</text>
<rect x="630" y="261" width="16.374358974358977" height="14" rx="3" fill="#4a7c59" opacity="0.75"/>
<text x="46" y="326" font-size="11" fill="#999" text-anchor="start">Split by leg, at the default</text>
<rect x="46" y="336" width="380" height="40" rx="6" fill="#fdf3e7" stroke="#c96" stroke-width="1.5"/>
<text x="236" y="354" font-size="10.5" fill="#555" text-anchor="middle">client → MCP proxy</text>
<text x="236" y="369" font-size="13" fill="#b5651d" text-anchor="middle" font-weight="bold">22ms</text>
<rect x="456" y="336" width="380" height="40" rx="6" fill="#eef3ee" stroke="#8a8" stroke-width="1.5"/>
<text x="646" y="354" font-size="10.5" fill="#555" text-anchor="middle">MCP proxy → backend</text>
<text x="646" y="369" font-size="13" fill="#4a7c59" text-anchor="middle" font-weight="bold">1ms</text>
<text x="450.0" y="396" font-size="10" fill="#999" text-anchor="middle">0ms to first byte out</text>
<text x="450.0" y="422.0" font-size="9.5" fill="#777" text-anchor="middle">No policy, a CEL on the values passed, or twenty rules all give the same figure.</text>
<text x="450.0" y="435.5" font-size="9.5" fill="#777" text-anchor="middle">It is not the cost of evaluating rules.</text>
<text x="450.0" y="449.0" font-size="9.5" fill="#777" text-anchor="middle">This leg is the key derivation the proxy runs to unwrap the session ID on every request.</text>
<text x="450.0" y="462.5" font-size="9.5" fill="#777" text-anchor="middle">Lowering the count drops what the proxy adds from 20ms to 0.5ms.</text>
<text x="450.0" y="476.0" font-size="9.5" fill="#777" text-anchor="middle">The first three rows are from the campaign; the last is a separate run that varied the count.</text>
</svg>

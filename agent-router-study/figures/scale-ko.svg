<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5651d"/></marker></defs>
<rect width="900" height="432" fill="white"/>
<text x="450.0" y="32" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">복제본만 늘리면 처리량이 오르지 않는다</text>
<text x="450.0" y="54" font-size="11.5" fill="#777" text-anchor="middle">목표 초당 100건을 연결마다 새로 열어 건 회차다. 기본값은 복제본 1개에 Local이다.</text>
<text x="320.0" y="96" font-size="11" fill="#666" text-anchor="middle" font-family="Menlo, monospace">externalTrafficPolicy: Local</text>
<text x="660.0" y="96" font-size="11" fill="#666" text-anchor="middle" font-family="Menlo, monospace">externalTrafficPolicy: Cluster</text>
<text x="144" y="154.0" font-size="12" fill="#444" text-anchor="end" font-weight="bold">복제본 1</text>
<rect x="160" y="106" width="320" height="96" rx="6" fill="#ffffff" stroke="#b5651d" stroke-width="2"/>
<text x="320.0" y="134" font-size="13.5" fill="#b5651d" text-anchor="middle" font-weight="bold">100.0 달성</text>
<text x="320.0" y="154" font-size="11.5" fill="#555" text-anchor="middle">p50 99ms</text>
<text x="320.0" y="172" font-size="10.5" fill="#777" text-anchor="middle">보내지 못한 요청 0</text>
<text x="320.0" y="191" font-size="9.5" fill="#999" text-anchor="middle">기본값</text>
<rect x="500" y="106" width="320" height="96" rx="6" fill="#ffffff" stroke="#b5651d" stroke-width="2"/>
<text x="660.0" y="134" font-size="13.5" fill="#b5651d" text-anchor="middle" font-weight="bold">99.2 달성</text>
<text x="660.0" y="154" font-size="11.5" fill="#555" text-anchor="middle">p50 133ms</text>
<text x="660.0" y="172" font-size="10.5" fill="#777" text-anchor="middle">보내지 못한 요청 24</text>
<text x="144" y="268.0" font-size="12" fill="#444" text-anchor="end" font-weight="bold">복제본 2</text>
<rect x="160" y="220" width="320" height="96" rx="6" fill="#ffffff" stroke="#b5651d" stroke-width="2"/>
<text x="320.0" y="248" font-size="13.5" fill="#b5651d" text-anchor="middle" font-weight="bold">99.3 달성</text>
<text x="320.0" y="268" font-size="11.5" fill="#555" text-anchor="middle">p50 118ms</text>
<text x="320.0" y="286" font-size="10.5" fill="#777" text-anchor="middle">보내지 못한 요청 21</text>
<text x="320.0" y="305" font-size="9.5" fill="#999" text-anchor="middle">늘려도 한쪽만 받는다</text>
<rect x="500" y="220" width="320" height="96" rx="6" fill="#ffffff" stroke="#4a7c59" stroke-width="2"/>
<text x="660.0" y="248" font-size="13.5" fill="#4a7c59" text-anchor="middle" font-weight="bold">100.0 달성</text>
<text x="660.0" y="268" font-size="11.5" fill="#555" text-anchor="middle">p50 25.7ms</text>
<text x="660.0" y="286" font-size="10.5" fill="#777" text-anchor="middle">보내지 못한 요청 0</text>
<text x="450.0" y="350" font-size="10" fill="#888" text-anchor="middle">MetalLB가 L2로 주소를 알리는 환경에서 Local이면 알림 노드의 파드만 요청을 받는다.</text>
<text x="450.0" y="378" font-size="9.5" fill="#777" text-anchor="middle">둘을 같이 바꾼 조합에서만 지연이 내려간다.</text>
<text x="450.0" y="392" font-size="9.5" fill="#777" text-anchor="middle">복제본만 늘리거나 트래픽 정책만 바꾸면 오히려 오른다.</text>
<text x="450.0" y="406" font-size="9.5" fill="#777" text-anchor="middle">제안 문서에 적힌 "어떤 인스턴스도 세션을 처리할 수 있다"가 성립한다.</text>
</svg>

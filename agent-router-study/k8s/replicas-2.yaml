# 복제본 2개 조건.
# externalTrafficPolicy를 Cluster로 둔다. MetalLB L2에서 Local이면 알림 노드의
# 파드만 요청을 받아 복제본을 늘려도 한쪽만 일한다(2026-09-14 실측으로 확인).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata: {name: ar-proxy-2, namespace: mcp-pilot}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
      envoyDeployment:
        replicas: 2
